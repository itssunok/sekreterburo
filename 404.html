<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Sayfa Bulunamadı | Page Not Found — Sekreter Büro</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/assets/styles/main.css">
  <style>
    body { background: var(--navy); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-page { max-width: 520px; margin: 0 auto; padding: 48px 32px; text-align: center; }
    .error-code {
      font-family: 'Playfair Display', serif; font-size: 88px; font-weight: 700;
      color: var(--gold); line-height: 1; margin-bottom: 8px;
    }
    .error-title {
      font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700;
      color: var(--white); margin-bottom: 20px;
    }
    .error-msg { color: rgba(255,255,255,0.65); font-size: 15px; line-height: 1.7; margin-bottom: 8px; }
    .error-actions { display: flex; gap: 14px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Sayfa Bulunamadı / Page Not Found</h1>
    <p class="error-msg">Aradığınız sayfa taşınmış veya kaldırılmış olabilir.</p>
    <p class="error-msg">The page you're looking for may have moved or been removed.</p>
    <div class="error-actions">
      <a href="./" class="btn-primary">Ana Sayfa (TR) &nbsp;→</a>
      <a href="en/" class="btn-primary">Homepage (EN) &nbsp;→</a>
    </div>
  </div>

</body>
</html>
